<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncOps — Detalhe da Checklist</title>
 
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/utilities.css" />
 
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
 
<body>
  <header>
    <div class="logo-area">
      <p>
        <a href="index.html">SyncOps</a>
      </p>
    </div>
 
    <div class="header-acoes">
      <button class="btn-header" id="btn-darkmode" aria-label="Ativar modo escuro">
        <svg id="darkmode-icon" viewBox="0 0 30 29" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M23.1059 3.99986H29M26.0529 1V6.99971M27.5044 15.2283C27.3663 17.8324 26.4901 20.34 24.9818 22.4481C23.4735 24.5561 21.3976 26.1743 19.005 27.107C16.6125 28.0398 14.0058 28.2471 11.5 27.704C8.99413 27.1609 6.6965 25.8906 4.8848 24.0466C3.07309 22.2027 1.82489 19.864 1.29107 17.3134C0.757254 14.7627 0.960674 12.1093 1.87674 9.67381C2.79282 7.23833 4.38232 5.12508 6.4531 3.58953C8.52389 2.05397 10.9873 1.16185 13.5456 1.021C14.1423 0.988 14.4547 1.71097 14.1379 2.22544C13.0783 3.95119 12.6246 5.99156 12.8508 8.01359C13.077 10.0356 13.9698 11.9199 15.3835 13.3589C16.7972 14.798 18.6484 15.7068 20.6348 15.937C22.6213 16.1673 24.6257 15.7055 26.3211 14.6268C26.828 14.3044 27.5368 14.6208 27.5044 15.2283Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
 
      <button class="btn-header" aria-label="Icone com usuário">
        <svg id="user-icon" viewBox="0 0 33 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16.5 21C21.8503 21 26.1875 16.5228 26.1875 11C26.1875 5.47715 21.8503 1 16.5 1C11.1497 1 6.8125 5.47715 6.8125 11C6.8125 16.5228 11.1497 21 16.5 21ZM16.5 21C20.6109 21 24.5533 22.6857 27.4602 25.6863C30.367 28.6869 32 32.7565 32 37M16.5 21C12.3891 21 8.44666 22.6857 5.53985 25.6863C2.63303 28.6869 1 32.7565 1 37" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </header>
 
  <main style="padding: 24px 0;">
    <section class="card-header" style="margin-top: 0;">
      <div class="card-header-main" style="border-bottom: 1px solid var(--componente-secundario); padding-bottom: 18px;">
        <div>
          <h2 class="title-h2" id="detalhe-titulo">Checklist</h2>
          <div style="display:flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; align-items:center;" id="detalhe-tags"></div>
        </div>
 
        <button class="btn-cancelar" id="btn-voltar" type="button">← Voltar</button>
      </div>
    </section>
 
    <section id="detalhe-container" class="card-tasks" style="margin-top: 20px;">
      <div class="created-tasks-container" style="height: auto;">
        <div class="progresso-wrapper" style="margin: 0; width: 100%;">
          <span class="progresso-label" id="detalhe-progresso-label">0%</span>
          <div class="progresso-track">
            <div class="barra-preenchimento" id="detalhe-progresso-barra"></div>
          </div>
        </div>
 
        <div style="width:100%; margin-top: 14px; color: var(--texto-hierarquia-2); font-size: var(--text-sm);" id="detalhe-meta">—</div>
 
        <div class="divider" style="margin-top: 18px; margin-bottom: 18px;"></div>
 
        <div id="detalhe-tasks" class="tasks-list" style="height: auto; max-height: 520px;"></div>
      </div>
    </section>
  </main>
 
  <script src="assets/js/storage.js" defer></script>
  <script src="assets/js/darkmode.js" defer></script>
 
  <script>
    const ui = {
      titulo: document.getElementById('detalhe-titulo'),
      tags: document.getElementById('detalhe-tags'),
      meta: document.getElementById('detalhe-meta'),
      tasks: document.getElementById('detalhe-tasks'),
      progressoLabel: document.getElementById('detalhe-progresso-label'),
      progressoBarra: document.getElementById('detalhe-progresso-barra'),
      voltar: document.getElementById('btn-voltar'),
    };
 
    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '<')
        .replaceAll('>', '>')
        .replaceAll('"', '"')
        .replaceAll("'", '&#039;');
    }
 
    function statusTag(checklist) {
      const status = checklist?.status || 'nao-iniciada';
      if (status === 'concluido') {
        return `
          <div class="tag-progresso concluido">
            <svg class="tag-icone" viewBox="0 0 31 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M29.708 13.0051C30.3702 16.367 29.8983 19.8622 28.3709 22.9078C26.8435 25.9533 24.353 28.3652 21.3147 29.7411C18.2764 31.117 14.874 31.3738 11.6748 30.4686C8.47566 29.5635 5.67313 27.5512 3.7346 24.7672C1.79608 21.9833 0.838731 18.5959 1.02222 15.1702C1.2057 11.7444 2.51893 8.48724 4.74289 5.94186C6.96686 3.39649 9.96714 1.71676 13.2434 1.18279C16.5196 0.648826 19.8738 1.2929 22.7466 3.00761M11.1466 14.5051L15.4966 19.0051L29.9966 4.00511" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="tag-texto">Concluído</span>
          </div>`;
      }
 
      if (status === 'andamento') {
        return `
          <div class="tag-progresso andamento">
            <svg class="tag-icone" viewBox="0 0 31 35" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15.5 1V7.6M21.59 10.57L25.795 5.785M24.2 17.5H30M21.59 24.43L25.795 29.215M15.5 27.4V34M5.205 29.215L9.41 24.43M1 17.5H6.8M5.205 5.785L9.41 10.57" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="tag-texto">Andamento</span>
          </div>`;
      }
 
      return `
        <div class="tag-progresso nao-iniciada">
          <svg class="tag-icone" viewBox="0 0 27 27" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4.66125 4.66125L22.3375 22.3387M26 13.5C26 20.4036 20.4036 26 13.5 26C6.59644 26 1 20.4036 1 13.5C1 6.59644 6.59644 1 13.5 1C20.4036 1 26 6.59644 26 13.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="tag-texto">Não iniciada</span>
        </div>`;
    }
 
    function prioridadeTag(priority) {
      const p = priority || 'baixa';
      // reusa estilos do projeto: .tag-prioridade.{alta|media|baixa}
      if (p === 'media') {
        return `
          <div class="tag-prioridade media">
            <svg class="tag-icone" viewBox="0 0 29 33" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0.600098 31.6V3.69998C0.600098 3.45935 0.661092 3.22202 0.778252 3.00679C0.895411 2.79157 1.06552 2.60435 1.2751 2.45998C3.0277 1.25263 5.15935 0.599976 7.3501 0.599976C12.4126 0.599976 15.7876 3.69998 19.7245 3.69998C21.9745 3.69998 23.6997 3.28664 24.9001 2.45998C25.1508 2.28726 25.4489 2.18209 25.7611 2.15624C26.0732 2.13039 26.387 2.18488 26.6673 2.31361C26.9476 2.44235 27.1833 2.64023 27.3481 2.88509C27.5128 3.12996 27.6001 3.41212 27.6001 3.69998V19.2C27.6001 19.4406 27.5391 19.6779 27.4219 19.8932C27.3048 20.1084 27.1347 20.2956 26.9251 20.44C25.1725 21.6473 23.0408 22.3 20.8501 22.3C15.7876 22.3 12.4126 19.2 7.3501 19.2C4.85955 19.2 2.45639 20.0432 0.600098 21.5684" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="tag-texto">Média</span>
          </div>`;
      }
 
      if (p === 'alta') {
        return `
          <div class="tag-prioridade alta">
            <svg class="tag-icone" viewBox="0 0 29 33" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0.600098 31.6V3.69998C0.600098 3.45935 0.661092 3.22202 0.778252 3.00679C0.895411 2.79157 1.06552 2.60435 1.2751 2.45998C3.0277 1.25263 5.15935 0.599976 7.3501 0.599976C12.4126 0.599976 15.7876 3.69998 19.7245 3.69998C21.9745 3.69998 23.6997 3.28664 24.9001 2.45998C25.1508 2.28726 25.4489 2.18209 25.7611 2.15624C26.0732 2.13039 26.387 2.18488 26.6673 2.31361C26.9476 2.44235 27.1833 2.64023 27.3481 2.88509C27.5128 3.12996 27.6001 3.41212 27.6001 3.69998V19.2C27.6001 19.4406 27.5391 19.6779 27.4219 19.8932C27.3048 20.1084 27.1347 20.2956 26.9251 20.44C25.1725 21.6473 23.0408 22.3 20.8501 22.3C15.7876 22.3 12.4126 19.2 7.3501 19.2C4.85955 19.2 2.45639 20.0432 0.600098 21.5684" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="tag-texto">Alta</span>
          </div>`;
      }
 
      return `
        <div class="tag-prioridade baixa">
          <svg class="tag-icone" viewBox="0 0 29 33" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0.600098 31.6V3.69998C0.600098 3.45935 0.661092 3.22202 0.778252 3.00679C0.895411 2.79157 1.06552 2.60435 1.2751 2.45998C3.0277 1.25263 5.15935 0.599976 7.3501 0.599976C12.4126 0.599976 15.7876 3.69998 19.7245 3.69998C21.9745 3.69998 23.6997 3.28664 24.9001 2.45998C25.1508 2.28726 25.4489 2.18209 25.7611 2.15624C26.0732 2.13039 26.387 2.18488 26.6673 2.31361C26.9476 2.44235 27.1833 2.64023 27.3481 2.88509C27.5128 3.12996 27.6001 3.41212 27.6001 3.69998V19.2C27.6001 19.4406 27.5391 19.6779 27.4219 19.8932C27.3048 20.1084 27.1347 20.2956 26.9251 20.44C25.1725 21.6473 23.0408 22.3 20.8501 22.3C15.7876 22.3 12.4126 19.2 7.3501 19.2C4.85955 19.2 2.45639 20.0432 0.600098 21.5684" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="tag-texto">Baixa</span>
        </div>`;
    }
 
    function formatarData(value) {
      if (!value) return '';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value);
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }
 
    function renderChecklist(checklist) {
      if (!checklist) return;
 
      const priority = checklist.priority || 'baixa';
 
      ui.titulo.textContent = checklist.title || 'Checklist';
 
      // tags
      ui.tags.innerHTML = `${statusTag(checklist)} ${prioridadeTag(priority)}`;
 
      const area = checklist.area ? `Área: ${escapeHtml(checklist.area)}` : '';
      const deadline = checklist.deadline ? `Prazo: ${escapeHtml(formatarData(checklist.deadline))}` : '';
      const status = checklist.status ? `Status: ${escapeHtml(checklist.status)}` : '';
      ui.meta.textContent = [area, deadline, status].filter(Boolean).join(' • ') || '—';
 
      // progresso
      const progress = typeof checklist.progress === 'number' ? checklist.progress : calcularProgresso(checklist.tasks || []);
      ui.progressoLabel.textContent = `${progress}%`;
      ui.progressoBarra.style.width = `${progress}%`;
 
      // tasks
      const tasks = checklist.tasks || [];
      if (tasks.length === 0) {
        ui.tasks.innerHTML = '<div class="tasks-empty">Nenhuma tarefa.<br>Volte e crie tarefas no Manager.</div>';
        return;
      }
 
      ui.tasks.innerHTML = tasks
        .map((t, idx) => {
          const pr = t.priority || 'baixa';
          const done = !!t.completed;
          const checkboxChecked = done ? 'checked' : '';
 
          return `
            <div class="task-item ${done ? 'task-item-ativa' : ''}" data-task-id="${escapeHtml(t.id)}" role="button" tabindex="0" aria-pressed="${done}">
              <div class="task-item-corpo">
                <div class="task-item-titulo" style="display:flex; align-items:center; gap:10px;">
                  <span style="font-weight:700; color: var(--texto-hierarquia-2);">${String(idx + 1).padStart(2, '0')}</span>
                  <span style="text-decoration:${done ? 'line-through' : 'none'}; color:${done ? 'var(--texto-desabilitado)' : 'var(--texto-principal)'};">${escapeHtml(t.title || 'Sem título')}</span>
                  <label style="margin-left:auto; cursor:pointer; display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" ${checkboxChecked} />
                  </label>
                </div>
 
                <div class="task-item-meta" style="margin-top:6px;">
                  <div class="task-item-prioridade ${escapeHtml(pr)}">${escapeHtml(pr)}</div>
                </div>
 
                <div style="margin-top:8px; font-size: var(--text-sm); color: var(--texto-hierarquia-2); line-height: 1.6;">
                  ${escapeHtml(t.description || '')}
                </div>
              </div>
            </div>
          `;
        })
        .join('');
 
      // eventos: alterna completed
      ui.tasks.querySelectorAll('.task-item').forEach(item => {
        const taskId = item.dataset.taskId;
        item.addEventListener('click', () => toggleTask(checklist.id, checklist, taskId));
        item.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleTask(checklist.id, checklist, taskId);
          }
        });
 
        // checkbox não deve “propagar” duplicado
        item.querySelector('input[type="checkbox"]')?.addEventListener('click', (e) => e.stopPropagation());
      });
    }
 
    function toggleTask(checklistId, checklistObj, taskId) {
      if (!checklistObj || !taskId) return;
 
      const tasks = (checklistObj.tasks || []).map(t => ({...t}));
      const idx = tasks.findIndex(t => String(t.id) === String(taskId));
      if (idx < 0) return;
 
      tasks[idx].completed = !tasks[idx].completed;
 
      const progress = calcularProgresso(tasks);
      const allDone = tasks.length > 0 && tasks.every(t => !!t.completed);
      const status = allDone ? 'concluido' : 'andamento';
 
      updateCheckList(checklistId, { tasks, progress, status, updateAt: new Date().toISOString() });
 
      // re-carrega do storage para manter consistência
      const updated = getAllChecklists().find(c => c.id === checklistId);
      renderChecklist(updated || { ...checklistObj, tasks, progress, status });
    }
 
    function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
 
      ui.voltar.addEventListener('click', () => {
        window.location.href = 'index.html';
      });
 
      if (!id) {
        ui.titulo.textContent = 'Checklist não encontrada';
        ui.tags.innerHTML = '';
        ui.meta.textContent = 'ID ausente na URL.';
        ui.tasks.innerHTML = '<div class="tasks-empty">Não foi possível carregar os detalhes.</div>';
        return;
      }
 
      const checklist = (getAllChecklists() || []).find(c => String(c.id) === String(id));
      if (!checklist) {
        ui.titulo.textContent = 'Checklist não encontrada';
        ui.meta.textContent = 'Esse checklist não existe mais no seu navegador.';
        ui.tasks.innerHTML = '<div class="tasks-empty">Abra a página principal para selecionar outro checklist.</div>';
        ui.tags.innerHTML = '';
        return;
      }
 
      renderChecklist(checklist);
    }
 
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
